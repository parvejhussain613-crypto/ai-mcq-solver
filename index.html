<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MCQ Tools</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Header -->
  <header class="header">
    <button class="menu-btn">☰</button>

    <div class="logo">
      🤖 MCQ Tools
    </div>

    <button class="profile-btn">👤</button>
  </header>


  <!-- Main Content -->
  <main class="container">

    <div class="ai-icon">✨</div>

    <h1>What can I help you with?</h1>

    <p class="subtitle">
      Ask your MCQ question and let AI solve it for you.
    </p>


    <!-- Question Input -->
    <div class="input-area">

      <textarea
        id="question"
        placeholder="Enter your MCQ question here..."
      ></textarea>

    </div>
<!-- MCQ Input Area -->
<div class="mcq-input-wrapper">

    <!-- Question Input -->
    <textarea
        id="question"
        placeholder="Ask your MCQ question..."
        rows="1"
    ></textarea>

    <!-- Bottom Action Bar -->
    <div class="input-actions">

        <!-- Plus Button -->
        <button
            type="button"
            class="plus-btn"
            onclick="document.getElementById('imageInput').click()"
            title="Capture MCQ"
        >
            +
        </button>

        <!-- Voice Button -->
        <button
            type="button"
            class="voice-btn"
            onclick="startVoiceInput()"
            title="Voice Input"
        >
            🎤
        </button>

        <!-- Solve Button -->
        <button
            type="button"
            class="send-btn"
            onclick="solveMCQ()"
            title="Solve MCQ"
        >
            ↑
        </button>

    </div>
</div>


<!-- MCQ Options -->
<div class="options">

    <input
        id="optionA"
        class="option-input"
        type="text"
        placeholder="Option A"
    >

    <input
        id="optionB"
        class="option-input"
        type="text"
        placeholder="Option B"
    >

    <input
        id="optionC"
        class="option-input"
        type="text"
        placeholder="Option C"
    >

    <input
        id="optionD"
        class="option-input"
        type="text"
        placeholder="Option D"
    >

</div>


<!-- Hidden Image Input -->
<input
    type="file"
    id="imageInput"
    accept="image/*"
    capture="environment"
    style="display:none;"
>

    <!-- Hidden Image Input -->
    <input
      type="file"
      id="imageInput"
      accept="image/*"
      capture="environment"
      style="display:none;"
    >


    <!-- AI Answer -->
    <div id="result">
      🤖 AI Answer
      <br>
      <span>Your answer will appear here...</span>
    </div>


    <!-- History -->
    <div class="history">

      <h2>📚 History</h2>

      <div id="historyList">
        No questions solved yet.
      </div>

    </div>

  </main>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
