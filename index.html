<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->
  <header class="top-header">

    <button class="menu-btn" id="menuBtn">☰</button>

    <div class="logo">
      🤖 <span>Smart AI</span>
    </div>

    <button class="profile-btn">👤</button>

  </header>


  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-logo">
      🤖 Smart AI
    </div>

    <button id="newChatBtn">
      ➕ New Chat
    </button>

    <button id="historyBtn">
      📚 Chat History
    </button>

    <button id="settingsBtn">
      ⚙️ Settings
    </button>

  </aside>


  <!-- Main Chat Area -->
  <main class="main-content">

    <!-- Welcome Screen -->
    <section class="welcome-screen" id="welcomeScreen">

      <div class="ai-logo">
        ✨
      </div>

      <h1>What can I help you with?</h1>

      <p>
        Ask anything, solve questions, analyze images,
        create content, or upload files.
      </p>

    </section>


    <!-- Chat Messages -->
    <section class="chat-container" id="chatContainer">

    </section>

<!-- Image Preview Area -->
<div id="previewArea" class="preview-area"></div>

<!-- ====== AI Assistant Input ====== -->
<div class="chat-input-wrapper">
 ...
</div>
    <!-- Bottom Input -->
    <div class="input-wrapper">

      <button class="plus-btn" id="plusBtn">
        +
      </button>

      <textarea
        id="messageInput"
        placeholder="Ask anything..."
        rows="1"
      ></textarea>

      <button class="mic-btn" id="micBtn">
        🎤
      </button>

      <button class="send-btn" id="sendBtn">
        ↑
      </button>

    </div>


    <!-- Attachment Menu -->
    <div class="attachment-menu" id="attachmentMenu">

      <button id="cameraBtn">
        📷
        <span>Camera</span>
      </button>

      <button id="photoBtn">
        🖼️
        <span>Photos</span>
      </button>

      <button id="fileBtn">
        📄
        <span>Files</span>
      </button>

    </div>


    <!-- Hidden File Inputs -->
    <input
      type="file"
      id="photoInput"
      accept="image/*"
      hidden
    >

    <input
      type="file"
      id="fileInput"
      hidden
    >

    <input
      type="file"
      id="cameraInput"
      accept="image/*"
      capture="environment"
      hidden
    >

  </main>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
