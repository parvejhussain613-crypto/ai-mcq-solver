<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Header -->
  <header class="top-header">

    <button id="menuBtn" class="menu-btn">
      ☰
    </button>

    <div class="app-name">
      Smart AI
    </div>

    <button class="new-chat-btn">
      ✎
    </button>

  </header>


  <!-- Main Home Screen -->
  <main id="homeScreen" class="home-screen">

    <div class="smart-ai-logo">
      ✨
    </div>

    <h1>
      What can I help you with?
    </h1>

  </main>


  <!-- Chat Area -->
  <main id="chatScreen" class="chat-screen">

    <div id="messages"></div>

  </main>


  <!-- Plus Menu -->
  <div id="plusMenu" class="plus-menu">

    <button id="photoBtn">
      🖼️ Photos
    </button>

    <button id="cameraBtn">
      📷 Camera
    </button>

    <button id="fileBtn">
      📎 Files
    </button>

  </div>


  <!-- Hidden Inputs -->
  <input
    type="file"
    id="photoInput"
    accept="image/*"
    hidden
  >

  <input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    hidden
  >

  <input
    type="file"
    id="fileInput"
    accept=".pdf,.doc,.docx,.txt"
    hidden
  >


  <!-- Bottom Input -->
  <div class="input-container">

    <div class="input-box">

      <button
        id="plusBtn"
        class="plus-btn"
      >
        +
      </button>

      <textarea
        id="messageInput"
        placeholder="Ask Smart AI"
        rows="1"
      ></textarea>

      <button
        id="micBtn"
        class="mic-btn"
      >
        🎤
      </button>

      <button
        id="sendBtn"
        class="send-btn"
      >
        ↑
      </button>

    </div>

  </div>


  <!-- Side Menu -->
  <div id="sideMenu" class="side-menu">

    <div class="side-menu-header">
      <h2>Smart AI</h2>

      <button id="closeMenu">
        ✕
      </button>
    </div>

    <button id="newChat">
      ✨ New chat
    </button>

    <div class="history-title">
      Recent chats
    </div>

    <div id="chatHistory">
      <!-- Old chats will appear here -->
    </div>

  </div>


  <!-- Dark Overlay -->
  <div id="overlay"></div>


  <script src="script.js"></script>

</body>
</html>
