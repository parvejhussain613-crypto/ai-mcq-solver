<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MCQ Tools</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Bar -->
  <header class="top-bar">

    <button class="menu-btn" id="menuBtn">
      ☰
    </button>

    <div class="app-name">
      MCQ Tools
      <span class="dot"></span>
    </div>

    <button class="new-btn" id="newBtn">
      ✨
    </button>

  </header>


  <!-- Main Screen -->
  <main class="main-screen">

    <!-- AI Icon -->
    <div class="ai-icon">
      ✨
    </div>

    <!-- Welcome Text -->
    <h1>
      What can I help with?
    </h1>

    <p class="subtitle">
      Ask anything about your MCQ
    </p>


    <!-- MCQ Question Input -->
    <div class="input-box">

      <textarea
        id="question"
        placeholder="Ask your MCQ question..."
      ></textarea>

      <!-- Options -->
      <div class="options">

        <input
          type="text"
          id="optionA"
          placeholder="Option A"
        >

        <input
          type="text"
          id="optionB"
          placeholder="Option B"
        >

        <input
          type="text"
          id="optionC"
          placeholder="Option C"
        >

        <input
          type="text"
          id="optionD"
          placeholder="Option D"
        >

      </div>


      <!-- Bottom Actions -->
      <div class="input-actions">

        <!-- Camera -->
        <input
          type="file"
          id="cameraInput"
          accept="image/*"
          capture="environment"
          onchange="previewImage(event)"
          hidden
        >

        <button
          class="action-btn"
          onclick="document.getElementById('cameraInput').click()"
        >
          📷
        </button>


        <!-- Subject -->
        <select id="subject">

          <option value="General">
            General
          </option>

          <option value="Math">
            Math
          </option>

          <option value="Science">
            Science
          </option>

          <option value="English">
            English
          </option>

          <option value="Computer">
            Computer
          </option>

        </select>


        <!-- Solve -->
        <button
          class="solve-btn"
          id="solveBtn"
          onclick="solveMCQ()"
        >
          ✨
        </button>

      </div>

    </div>


    <!-- Image Preview -->
    <img
      id="preview"
      class="preview"
      src=""
      alt="MCQ Preview"
    >


    <!-- AI Answer -->
    <div
      id="result"
      class="answer-box"
    >

      <div class="answer-title">
        ✨ AI Answer
      </div>

      <p>
        Your answer will appear here...
      </p>

    </div>


    <!-- History -->
    <section class="history-section">

      <h2>
        📚 History
      </h2>

      <div id="history">
        <!-- History will appear here -->
      </div>

    </section>

  </main>


  <!-- Side Menu -->
  <div
    id="sideMenu"
    class="side-menu"
  >

    <button id="closeMenu">
      ✕
    </button>

    <h2>
      MCQ Tools
    </h2>

    <button>
      🏠 Home
    </button>

    <button>
      📚 History
    </button>

    <button>
      ⚙️ Settings
    </button>

  </div>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
