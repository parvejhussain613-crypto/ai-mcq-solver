<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MCQ Tools AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       TOP HEADER
  ========================== -->

  <header class="header">

    <button
      id="menuBtn"
      class="menu-btn"
      type="button"
    >
      ☰
    </button>

    <div class="logo">
      🤖 MCQ Tools AI
    </div>

    <button
      class="profile-btn"
      type="button"
    >
      👤
    </button>

  </header>


  <!-- =========================
       SIDEBAR
  ========================== -->

  <div id="sidebar" class="sidebar">

    <div class="sidebar-header">
      <h2>🤖 MCQ Tools AI</h2>
    </div>

    <button
      id="newChatBtn"
      class="side-item"
      type="button"
    >
      ➕ New Chat
    </button>

    <button
      id="historyBtn"
      class="side-item"
      type="button"
    >
      📚 Chat History
    </button>

    <button
      id="settingsBtn"
      class="side-item"
      type="button"
    >
      ⚙️ Settings
    </button>

  </div>


  <!-- Sidebar Overlay -->

  <div
    id="overlay"
    class="overlay"
  ></div>


  <!-- =========================
       MAIN CHAT AREA
  ========================== -->

  <main class="container">

    <!-- Welcome Screen -->

    <section
      id="welcomeScreen"
      class="welcome-screen"
    >

      <div class="ai-icon">
        ✨
      </div>

      <h1>
        What can I help you with?
      </h1>

      <p class="subtitle">
        Ask anything, solve questions, analyze images,
        or upload files.
      </p>

    </section>


    <!-- Chat Messages -->

    <section
      id="chatMessages"
      class="chat-messages"
    >

      <!-- Messages will appear here -->

    </section>

  </main>


  <!-- =========================
       PLUS MENU
  ========================== -->

  <div
    id="plusMenu"
    class="plus-menu"
  >

    <button
      id="cameraBtn"
      class="plus-item"
      type="button"
    >
      📷
      <span>Camera</span>
    </button>

    <button
      id="photoBtn"
      class="plus-item"
      type="button"
    >
      🖼️
      <span>Photos</span>
    </button>

    <button
      id="fileBtn"
      class="plus-item"
      type="button"
    >
      📄
      <span>Files</span>
    </button>

  </div>


  <!-- =========================
       HIDDEN FILE INPUTS
  ========================== -->

  <input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    hidden
  >

  <input
    type="file"
    id="photoInput"
    accept="image/*"
    hidden
  >

  <input
    type="file"
    id="fileInput"
    accept=".pdf,.doc,.docx,.txt,image/*"
    hidden
  >


  <!-- =========================
       CHAT INPUT
  ========================== -->

  <div class="chat-input-wrapper">

    <div class="chat-input-box">

      <!-- Plus -->

      <button
        id="plusBtn"
        class="input-icon"
        type="button"
      >
        +
      </button>


      <!-- Message -->

      <textarea
        id="messageInput"
        placeholder="Ask anything..."
        rows="1"
      ></textarea>


      <!-- Microphone -->

      <button
        id="micBtn"
        class="input-icon"
        type="button"
      >
        🎤
      </button>


      <!-- Send -->

      <button
        id="sendBtn"
        class="send-btn"
        type="button"
      >
        ↑
      </button>

    </div>

  </div>


  <!-- JavaScript -->

  <script src="script.js"></script>

</body>
</html>
